name: Package checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install system media tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Validate release package
        run: node scripts/maintenance/validate-package.mjs
      - name: Run modular unit suite
        run: for test_file in scripts/tests/unit/test-*.mjs; do node "$test_file"; done
      - name: Run workflow contract checks
        run: npm run test:workflow
      - name: Run Skill lifecycle checks
        run: |
          node scripts/tests/integration/test-skill-orchestration.mjs
          node scripts/tests/integration/test-skill-job-lifecycle.mjs
          node scripts/tests/integration/test-skill-preview-lifecycle.mjs
          node scripts/tests/integration/test-skill-formal-render.mjs
      - name: Run template admission checks
        run: |
          npm run test:t03-keyflow
          node scripts/tests/unit/test-t02-production-routing.mjs
